<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#000"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="340" y="28" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="16" font-weight="bold">Log and Audit Information Flow</text>
<!-- Main flow (left side) -->
<rect x="80" y="55" width="200" height="35" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="180" y="78" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">Client Call</text>
<line x1="180" y1="90" x2="180" y2="115" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="80" y="120" width="200" height="35" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="180" y="143" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">Interface Wrapper Layer</text>
<line x1="180" y1="155" x2="180" y2="180" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="80" y="185" width="200" height="35" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="180" y="208" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">Scheduler Layer</text>
<line x1="180" y1="220" x2="180" y2="245" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="80" y="250" width="200" height="35" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="180" y="273" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">Adapter Layer</text>
<line x1="180" y1="285" x2="180" y2="310" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="80" y="315" width="200" height="35" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="180" y="338" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">Device Execution</text>
<!-- Log arrows (right side) -->
<line x1="280" y1="137" x2="420" y2="137" stroke="#000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr)"/>
<line x1="280" y1="202" x2="420" y2="202" stroke="#000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr)"/>
<line x1="280" y1="267" x2="420" y2="267" stroke="#000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr)"/>
<line x1="280" y1="332" x2="420" y2="332" stroke="#000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr)"/>
<!-- Log store -->
<rect x="420" y="100" width="200" height="260" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="520" y="125" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12" font-weight="bold">Log Record Contents</text>
<line x1="430" y1="135" x2="610" y2="135" stroke="#000" stroke-width="0.5"/>
<text x="520" y="158" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Request ID</text>
<text x="520" y="183" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Interface Category</text>
<text x="520" y="208" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Action &amp; Algorithm</text>
<text x="520" y="233" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Selected Device</text>
<text x="520" y="258" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Backend Call Details</text>
<text x="520" y="283" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Execution Result</text>
<text x="520" y="308" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Error Information</text>
<text x="520" y="340" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">(Key plaintext not logged)</text>
<!-- Arrow down to outputs -->
<line x1="520" y1="360" x2="520" y2="395" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="180" y1="350" x2="180" y2="395" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Outputs -->
<rect x="80" y="400" width="200" height="35" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="180" y="423" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">Test Terminal Output</text>
<rect x="420" y="400" width="200" height="35" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="520" y="423" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">Audit &amp; Troubleshooting</text>
</svg>
