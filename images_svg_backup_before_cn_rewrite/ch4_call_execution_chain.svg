<svg xmlns="http://www.w3.org/2000/svg" width="680" height="780" viewBox="0 0 680 780">
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#000"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<!-- Title -->
<text x="340" y="35" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="18" font-weight="bold">Client-to-Device Call Chain</text>
<!-- Step 1 -->
<rect x="210" y="60" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="90" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Business Code Calls CCM API</text>
<line x1="340" y1="110" x2="340" y2="145" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Step 2 -->
<rect x="210" y="145" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="175" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Wrapper: Param Check &amp; Convert</text>
<line x1="340" y1="195" x2="340" y2="230" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Step 3 -->
<rect x="210" y="230" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="260" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Build JSON Unified Request</text>
<line x1="340" y1="280" x2="340" y2="315" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Step 4 -->
<rect x="210" y="315" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="345" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Send via Unix Socket to Gateway</text>
<line x1="340" y1="365" x2="340" y2="400" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Step 5 -->
<rect x="210" y="400" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="430" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Gateway Parses &amp; Dispatches</text>
<line x1="340" y1="450" x2="340" y2="485" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Step 6 -->
<rect x="210" y="485" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="515" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Translation Layer Maps Backend</text>
<line x1="340" y1="535" x2="340" y2="570" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Step 7 -->
<rect x="210" y="570" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="600" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Adapter Calls Device Function</text>
<line x1="340" y1="620" x2="340" y2="655" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Step 8 -->
<rect x="210" y="655" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="685" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Unified Response to Business</text>
</svg>
