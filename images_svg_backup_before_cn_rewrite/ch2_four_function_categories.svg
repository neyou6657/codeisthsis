<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#000"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="350" y="28" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="16" font-weight="bold">Four Function Categories of Unified Crypto Interface</text>
<!-- Four categories -->
<rect x="30" y="50" width="145" height="60" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="102" y="75" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12" font-weight="bold">Environment</text>
<text x="102" y="95" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">Init/Login/Capability</text>
<rect x="190" y="50" width="145" height="60" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="262" y="75" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12" font-weight="bold">Crypto Operation</text>
<text x="262" y="95" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">Hash/MAC/Encrypt-Decrypt</text>
<rect x="350" y="50" width="145" height="60" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="422" y="75" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12" font-weight="bold">Key Management</text>
<text x="422" y="95" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">Generate/KEM/Agreement</text>
<rect x="510" y="50" width="145" height="60" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="582" y="75" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12" font-weight="bold">Digital Signature</text>
<text x="582" y="95" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">Sign/Verify/Hybrid</text>
<!-- Arrows down to common structures -->
<line x1="102" y1="110" x2="102" y2="140" stroke="#000" stroke-width="1"/>
<line x1="262" y1="110" x2="262" y2="140" stroke="#000" stroke-width="1"/>
<line x1="422" y1="110" x2="422" y2="140" stroke="#000" stroke-width="1"/>
<line x1="582" y1="110" x2="582" y2="140" stroke="#000" stroke-width="1"/>
<!-- Horizontal connector -->
<line x1="102" y1="140" x2="582" y2="140" stroke="#000" stroke-width="1"/>
<line x1="350" y1="140" x2="350" y2="165" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
<!-- Label -->
<text x="350" y="180" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Common Usage</text>
<!-- Three base structures -->
<rect x="80" y="190" width="160" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="160" y="212" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12" font-weight="bold">Algorithm Params</text>
<text x="160" y="230" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">Unif_AlgParams</text>
<rect x="270" y="190" width="160" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="350" y="212" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12" font-weight="bold">Key Reference</text>
<text x="350" y="230" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">Unif_KeyRef</text>
<rect x="460" y="190" width="160" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="540" y="212" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12" font-weight="bold">Data Buffer</text>
<text x="540" y="230" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">Unif_Buffer</text>
<!-- Arrows down -->
<line x1="160" y1="240" x2="160" y2="270" stroke="#000" stroke-width="1"/>
<line x1="350" y1="240" x2="350" y2="270" stroke="#000" stroke-width="1"/>
<line x1="540" y1="240" x2="540" y2="270" stroke="#000" stroke-width="1"/>
<line x1="160" y1="270" x2="540" y2="270" stroke="#000" stroke-width="1"/>
<line x1="350" y1="270" x2="350" y2="295" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
<!-- Unified request -->
<rect x="230" y="300" width="240" height="40" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="350" y="325" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">Unified Request Semantics</text>
<!-- Arrow down -->
<line x1="350" y1="340" x2="350" y2="370" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Scheduler -->
<rect x="230" y="370" width="240" height="40" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="350" y="395" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">Scheduler (Device Selection)</text>
<!-- Arrow down -->
<line x1="350" y1="410" x2="350" y2="440" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Adapter -->
<rect x="230" y="440" width="240" height="40" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="350" y="465" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">Adapter Layer (Device Call)</text>
</svg>
