<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720">
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#000"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<!-- Title -->
<text x="340" y="35" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="18" font-weight="bold">Interface Data Structure Relationships</text>
<!-- Top row: 3 structures -->
<rect x="40" y="70" width="160" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="120" y="100" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Unif_AlgParams</text>
<rect x="260" y="70" width="160" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="100" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Unif_KeyRef</text>
<rect x="480" y="70" width="160" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="560" y="100" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Unif_Buffer</text>
<!-- Arrows down to merge point -->
<line x1="120" y1="120" x2="120" y2="160" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="120" x2="340" y2="160" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560" y1="120" x2="560" y2="160" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Merge line -->
<line x1="120" y1="160" x2="560" y2="160" stroke="#000" stroke-width="1.5"/>
<line x1="340" y1="160" x2="340" y2="190" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- CCM API call -->
<rect x="230" y="190" width="220" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="220" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">CCM Unified API Call</text>
<line x1="340" y1="240" x2="340" y2="280" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- JSON request -->
<rect x="230" y="280" width="220" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="310" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">JSON Unified Request Build</text>
<line x1="340" y1="330" x2="340" y2="370" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Scheduling -->
<rect x="230" y="370" width="220" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="400" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Scheduler Capability Match</text>
<line x1="340" y1="420" x2="340" y2="460" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Translation -->
<rect x="230" y="460" width="220" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="490" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Translate to Device Params</text>
<line x1="340" y1="510" x2="340" y2="550" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Adapter -->
<rect x="230" y="550" width="220" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="580" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Adapter Execution</text>
<line x1="340" y1="600" x2="340" y2="640" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Response -->
<rect x="230" y="640" width="220" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="670" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Unified Response Return</text>
</svg>
