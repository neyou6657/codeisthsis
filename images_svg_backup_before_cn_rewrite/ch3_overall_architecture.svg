<svg xmlns="http://www.w3.org/2000/svg" width="700" height="580" viewBox="0 0 700 580">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#000"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="350" y="28" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="16" font-weight="bold">Unified Crypto Service Interface Architecture</text>
<!-- Layer 1: Business -->
<rect x="200" y="45" width="300" height="40" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="350" y="70" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="13">Business Application</text>
<line x1="350" y1="85" x2="350" y2="110" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Layer 2: Client Wrapper (CCM API) -->
<rect x="150" y="115" width="400" height="45" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="350" y="135" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12" font-weight="bold">Client Wrapper Layer (CCM API)</text>
<text x="350" y="152" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">Param Check / Build JSON Request / Algorithm ID Mapping</text>
<line x1="350" y1="160" x2="350" y2="185" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Transport -->
<rect x="220" y="185" width="260" height="30" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2"/>
<text x="350" y="205" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Unix Domain Socket Transport</text>
<line x1="350" y1="215" x2="350" y2="240" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Layer 3: Gateway -->
<rect x="150" y="245" width="400" height="45" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="350" y="265" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12" font-weight="bold">Server Gateway Layer</text>
<text x="350" y="282" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">JSON Parse / Thread Pool / Job Queue / PIN Verify</text>
<line x1="350" y1="290" x2="350" y2="315" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Layer 4: Scheduler -->
<rect x="150" y="320" width="400" height="45" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="350" y="340" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12" font-weight="bold">Scheduler Layer</text>
<text x="350" y="357" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">Capability Match / Device Select / Translation Rules / Serial Exec</text>
<line x1="350" y1="365" x2="350" y2="390" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Layer 5: Adapter -->
<rect x="150" y="395" width="400" height="45" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="350" y="415" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12" font-weight="bold">Adapter Layer</text>
<text x="350" y="432" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">7 Handlers (Device/Key/Asymmetric/Symmetric/Hash/File/PQC)</text>
<line x1="350" y1="440" x2="350" y2="465" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Layer 6: Devices -->
<rect x="60" y="470" width="180" height="40" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="150" y="495" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Classic HSM (SDF)</text>
<rect x="260" y="470" width="180" height="40" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="350" y="495" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">PQC Device</text>
<rect x="460" y="470" width="180" height="40" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="550" y="495" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Smart Token (SKF)</text>
<!-- Connecting lines to devices -->
<line x1="200" y1="465" x2="150" y2="470" stroke="#000" stroke-width="1"/>
<line x1="350" y1="465" x2="350" y2="470" stroke="#000" stroke-width="1"/>
<line x1="500" y1="465" x2="550" y2="470" stroke="#000" stroke-width="1"/>
<!-- Side label -->
<text x="620" y="200" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10" transform="rotate(90,640,280)">Client Process</text>
<line x1="630" y1="115" x2="630" y2="215" stroke="#000" stroke-width="0.8"/>
<text x="620" y="370" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10" transform="rotate(90,640,380)">Server Process</text>
<line x1="630" y1="245" x2="630" y2="510" stroke="#000" stroke-width="0.8"/>
</svg>
