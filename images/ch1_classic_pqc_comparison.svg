<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#000"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="360" y="28" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="16" font-weight="bold">Classic vs Post-Quantum Device Capability Comparison</text>
<!-- Left column: Classic -->
<rect x="40" y="50" width="280" height="30" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="180" y="70" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="13" font-weight="bold">Classic Crypto Device</text>
<rect x="40" y="90" width="280" height="30" fill="none" stroke="#000" stroke-width="1"/>
<text x="180" y="110" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Key Generation (RSA/SM2/SM4)</text>
<rect x="40" y="125" width="280" height="30" fill="none" stroke="#000" stroke-width="1"/>
<text x="180" y="145" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Symmetric Encrypt/Decrypt (SM4/AES)</text>
<rect x="40" y="160" width="280" height="30" fill="none" stroke="#000" stroke-width="1"/>
<text x="180" y="180" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Asymmetric Encrypt/Decrypt (SM2/RSA)</text>
<rect x="40" y="195" width="280" height="30" fill="none" stroke="#000" stroke-width="1"/>
<text x="180" y="215" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Digital Signature (SM2/RSA)</text>
<rect x="40" y="230" width="280" height="30" fill="none" stroke="#000" stroke-width="1"/>
<text x="180" y="250" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Hash (SM3/SHA)</text>
<rect x="40" y="265" width="280" height="30" fill="none" stroke="#000" stroke-width="1"/>
<text x="180" y="285" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Key Agreement (SM2/ECDH)</text>
<!-- Right column: PQC -->
<rect x="400" y="50" width="280" height="30" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="540" y="70" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="13" font-weight="bold">Post-Quantum Crypto Device</text>
<rect x="400" y="90" width="280" height="30" fill="none" stroke="#000" stroke-width="1"/>
<text x="540" y="110" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Key Generation (ML-KEM/ML-DSA)</text>
<rect x="400" y="125" width="280" height="30" fill="none" stroke="#000" stroke-width="1"/>
<text x="540" y="145" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">KEM Encap/Decap (ML-KEM)</text>
<rect x="400" y="160" width="280" height="30" fill="none" stroke="#000" stroke-width="1"/>
<text x="540" y="180" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">PQC Signature (ML-DSA/SLH-DSA)</text>
<rect x="400" y="195" width="280" height="30" fill="none" stroke="#000" stroke-width="1"/>
<text x="540" y="215" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Hybrid Signature (SM2+ML-DSA)</text>
<rect x="400" y="230" width="280" height="30" fill="none" stroke="#000" stroke-width="1"/>
<text x="540" y="250" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Hybrid Key Agreement (ECDH+ML-KEM)</text>
<rect x="400" y="265" width="280" height="30" fill="none" stroke="#000" stroke-width="1"/>
<text x="540" y="285" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Hash (SM3/SHA-3)</text>
<!-- Arrows down -->
<line x1="180" y1="300" x2="180" y2="340" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="540" y1="300" x2="540" y2="340" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Common abstraction -->
<rect x="80" y="340" width="560" height="35" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="360" y="363" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="13" font-weight="bold">Common Capability Abstraction</text>
<!-- Abstracted capabilities -->
<line x1="360" y1="375" x2="360" y2="400" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="60" y="400" width="130" height="35" fill="none" stroke="#000" stroke-width="1"/>
<text x="125" y="422" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Key Generation</text>
<rect x="200" y="400" width="130" height="35" fill="none" stroke="#000" stroke-width="1"/>
<text x="265" y="422" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Data Protection</text>
<rect x="340" y="400" width="130" height="35" fill="none" stroke="#000" stroke-width="1"/>
<text x="405" y="422" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Sign &amp; Verify</text>
<rect x="480" y="400" width="130" height="35" fill="none" stroke="#000" stroke-width="1"/>
<text x="545" y="422" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Key Establishment</text>
<!-- Arrow to unified model -->
<line x1="360" y1="435" x2="360" y2="470" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="200" y="470" width="320" height="40" fill="none" stroke="#000" stroke-width="2"/>
<text x="360" y="495" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="13" font-weight="bold">Unified Capability Model</text>
</svg>
