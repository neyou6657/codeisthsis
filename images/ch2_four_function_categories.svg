<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440">
  <rect x="0" y="0" width="700" height="440" fill="#ffffff"/>
  <text x="350" y="35" font-family="SimSun, serif" font-size="18" font-weight="bold" text-anchor="middle">四类接口功能模型</text>
  <!-- Four categories -->
  <rect x="40" y="70" width="140" height="70" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="110" y="98" font-family="SimSun, serif" font-size="14" font-weight="bold" text-anchor="middle">环境类</text>
  <text x="110" y="118" font-family="SimSun, serif" font-size="12" text-anchor="middle">8个函数</text>
  <rect x="200" y="70" width="140" height="70" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="270" y="98" font-family="SimSun, serif" font-size="14" font-weight="bold" text-anchor="middle">密码运算类</text>
  <text x="270" y="118" font-family="SimSun, serif" font-size="12" text-anchor="middle">9个函数</text>
  <rect x="360" y="70" width="140" height="70" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="430" y="98" font-family="SimSun, serif" font-size="14" font-weight="bold" text-anchor="middle">密钥管理类</text>
  <text x="430" y="118" font-family="SimSun, serif" font-size="12" text-anchor="middle">11个函数</text>
  <rect x="520" y="70" width="140" height="70" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="590" y="98" font-family="SimSun, serif" font-size="14" font-weight="bold" text-anchor="middle">数字签名类</text>
  <text x="590" y="118" font-family="SimSun, serif" font-size="12" text-anchor="middle">6个函数</text>
  <!-- Vertical lines down -->
  <line x1="110" y1="140" x2="110" y2="180" stroke="#000" stroke-width="1"/>
  <line x1="270" y1="140" x2="270" y2="180" stroke="#000" stroke-width="1"/>
  <line x1="430" y1="140" x2="430" y2="180" stroke="#000" stroke-width="1"/>
  <line x1="590" y1="140" x2="590" y2="180" stroke="#000" stroke-width="1"/>
  <!-- Horizontal merge line -->
  <line x1="110" y1="180" x2="590" y2="180" stroke="#000" stroke-width="1"/>
  <line x1="350" y1="180" x2="350" y2="220" stroke="#000" stroke-width="1"/>
  <polygon points="345,220 355,220 350,230" fill="#000"/>
  <!-- Unified interface model -->
  <rect x="230" y="235" width="240" height="50" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="350" y="265" font-family="SimSun, serif" font-size="15" font-weight="bold" text-anchor="middle">统一接口 (34个函数)</text>
  <!-- Down to three structures -->
  <line x1="350" y1="285" x2="350" y2="315" stroke="#000" stroke-width="1"/>
  <line x1="160" y1="315" x2="540" y2="315" stroke="#000" stroke-width="1"/>
  <line x1="160" y1="315" x2="160" y2="345" stroke="#000" stroke-width="1"/>
  <polygon points="155,345 165,345 160,355" fill="#000"/>
  <line x1="350" y1="315" x2="350" y2="345" stroke="#000" stroke-width="1"/>
  <polygon points="345,345 355,345 350,355" fill="#000"/>
  <line x1="540" y1="315" x2="540" y2="345" stroke="#000" stroke-width="1"/>
  <polygon points="535,345 545,345 540,355" fill="#000"/>
  <!-- Three base structures -->
  <rect x="80" y="360" width="160" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="160" y="390" font-family="SimSun, serif" font-size="14" text-anchor="middle">算法参数</text>
  <rect x="270" y="360" width="160" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="350" y="390" font-family="SimSun, serif" font-size="14" text-anchor="middle">密钥引用</text>
  <rect x="460" y="360" width="160" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="540" y="390" font-family="SimSun, serif" font-size="14" text-anchor="middle">数据缓冲</text>
  <text x="350" y="435" font-family="SimSun, serif" font-size="12" text-anchor="middle">三种基础数据结构</text>
</svg>
