<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440">
  <rect x="0" y="0" width="680" height="440" fill="#ffffff"/>
  <text x="340" y="35" font-family="SimSun, serif" font-size="18" font-weight="bold" text-anchor="middle">SDF接口函数数量膨胀示意</text>
  <text x="340" y="60" font-family="SimSun, serif" font-size="13" text-anchor="middle">每种算法 × 每种密钥位置 = 一个独立函数</text>
  <!-- Table header row: key locations -->
  <rect x="180" y="80" width="140" height="40" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="250" y="105" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">内部密钥</text>
  <rect x="320" y="80" width="140" height="40" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="390" y="105" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">外部密钥</text>
  <rect x="460" y="80" width="140" height="40" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="530" y="105" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">会话密钥</text>
  <!-- Row 1: RSA -->
  <rect x="40" y="120" width="140" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="110" y="150" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">RSA</text>
  <rect x="180" y="120" width="140" height="50" fill="none" stroke="#000" stroke-width="1"/>
  <text x="250" y="145" font-family="SimSun, serif" font-size="11" text-anchor="middle">InternalPrivate</text>
  <text x="250" y="160" font-family="SimSun, serif" font-size="11" text-anchor="middle">InternalPublic</text>
  <rect x="320" y="120" width="140" height="50" fill="none" stroke="#000" stroke-width="1"/>
  <text x="390" y="145" font-family="SimSun, serif" font-size="11" text-anchor="middle">ExternalPrivate</text>
  <text x="390" y="160" font-family="SimSun, serif" font-size="11" text-anchor="middle">ExternalPublic</text>
  <rect x="460" y="120" width="140" height="50" fill="none" stroke="#000" stroke-width="1"/>
  <text x="530" y="150" font-family="SimSun, serif" font-size="11" text-anchor="middle">GenerateKeyWith*</text>
  <!-- Row 2: ECC/SM2 -->
  <rect x="40" y="170" width="140" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="110" y="200" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">ECC/SM2</text>
  <rect x="180" y="170" width="140" height="50" fill="none" stroke="#000" stroke-width="1"/>
  <text x="250" y="195" font-family="SimSun, serif" font-size="11" text-anchor="middle">InternalSign</text>
  <text x="250" y="210" font-family="SimSun, serif" font-size="11" text-anchor="middle">InternalVerify</text>
  <rect x="320" y="170" width="140" height="50" fill="none" stroke="#000" stroke-width="1"/>
  <text x="390" y="195" font-family="SimSun, serif" font-size="11" text-anchor="middle">ExternalSign</text>
  <text x="390" y="210" font-family="SimSun, serif" font-size="11" text-anchor="middle">ExternalVerify</text>
  <rect x="460" y="170" width="140" height="50" fill="none" stroke="#000" stroke-width="1"/>
  <text x="530" y="200" font-family="SimSun, serif" font-size="11" text-anchor="middle">GenerateAgreement</text>
  <!-- Row 3: SM4 -->
  <rect x="40" y="220" width="140" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="110" y="250" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">SM4/AES</text>
  <rect x="180" y="220" width="420" height="50" fill="none" stroke="#000" stroke-width="1"/>
  <text x="390" y="250" font-family="SimSun, serif" font-size="12" text-anchor="middle">Encrypt / Decrypt / CalculateMAC</text>
  <!-- Row 4: Kyber -->
  <rect x="40" y="270" width="140" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="110" y="300" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">Kyber</text>
  <rect x="180" y="270" width="420" height="50" fill="none" stroke="#000" stroke-width="1"/>
  <text x="390" y="300" font-family="SimSun, serif" font-size="12" text-anchor="middle">GenerateKeyPair / Encap / Decap</text>
  <!-- Row 5: Dilithium -->
  <rect x="40" y="320" width="140" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="110" y="350" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">Dilithium</text>
  <rect x="180" y="320" width="420" height="50" fill="none" stroke="#000" stroke-width="1"/>
  <text x="390" y="350" font-family="SimSun, serif" font-size="12" text-anchor="middle">GenerateKeyPair / Sign / Verify</text>
  <!-- Conclusion -->
  <line x1="340" y1="370" x2="340" y2="395" stroke="#000" stroke-width="1"/>
  <polygon points="335,395 345,395 340,403" fill="#000"/>
  <rect x="230" y="408" width="220" height="30" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="340" y="428" font-family="SimSun, serif" font-size="14" font-weight="bold" text-anchor="middle">合计超过50个函数入口</text>
</svg>
