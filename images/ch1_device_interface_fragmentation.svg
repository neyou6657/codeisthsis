<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#000"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<!-- Title -->
<text x="390" y="30" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="16" font-weight="bold">Crypto Device Interface Fragmentation</text>
<!-- Business System -->
<rect x="290" y="50" width="200" height="40" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="390" y="75" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="13">Business System</text>
<!-- Arrows down from business system -->
<line x1="190" y1="90" x2="190" y2="150" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="340" y1="90" x2="340" y2="150" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="490" y1="90" x2="490" y2="150" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="640" y1="90" x2="640" y2="150" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Horizontal line from business system to each arrow top -->
<line x1="190" y1="90" x2="640" y2="90" stroke="#000" stroke-width="1.2"/>
<line x1="390" y1="90" x2="390" y2="90" stroke="#000" stroke-width="1.2"/>
<!-- Device interfaces row -->
<rect x="100" y="150" width="180" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="190" y="172" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">Classic HSM Interface</text>
<text x="190" y="190" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">(SDF/GM/T 0018)</text>
<rect x="250" y="150" width="180" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="172" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">Smart Token Interface</text>
<text x="340" y="190" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">(SKF/GM/T 0016)</text>
<rect x="400" y="150" width="180" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="490" y="172" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">PQC Device Interface</text>
<text x="490" y="190" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">(ML-KEM/ML-DSA)</text>
<rect x="550" y="150" width="180" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="640" y="172" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12">Software Crypto Library</text>
<text x="640" y="190" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">(OpenSSL/liboqs)</text>
<!-- Difference labels -->
<rect x="80" y="240" width="620" height="130" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>
<text x="390" y="260" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="12" font-weight="bold">Interface Differences</text>
<text x="160" y="290" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Session Mgmt Differs</text>
<text x="310" y="290" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Key Reference Differs</text>
<text x="470" y="290" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Algorithm Naming Differs</text>
<text x="620" y="290" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Data Buffer Differs</text>
<text x="160" y="320" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Error Handling Differs</text>
<text x="310" y="320" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Capability Decl Differs</text>
<text x="470" y="320" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Param Length Differs</text>
<text x="620" y="320" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Call Flow Differs</text>
<!-- Result -->
<text x="390" y="360" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Causes difficulty in smooth business migration</text>
<!-- Arrow down to solution -->
<line x1="390" y1="380" x2="390" y2="420" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Solution box -->
<rect x="240" y="420" width="300" height="45" fill="none" stroke="#000" stroke-width="2"/>
<text x="390" y="440" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="13" font-weight="bold">Need Unified Crypto Interface</text>
<text x="390" y="458" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Shield underlying device differences</text>
</svg>
