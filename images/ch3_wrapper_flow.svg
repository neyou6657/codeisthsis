<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>
  <text x="350" y="35" font-family="SimSun, serif" font-size="18" font-weight="bold" text-anchor="middle">客户端封装层请求流程</text>
  <!-- Step 1: Business call -->
  <rect x="40" y="80" width="160" height="60" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="120" y="105" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">业务调用</text>
  <text x="120" y="125" font-family="SimSun, serif" font-size="11" text-anchor="middle">CCM_Sign(...)</text>
  <!-- Arrow right -->
  <line x1="200" y1="110" x2="240" y2="110" stroke="#000" stroke-width="1"/>
  <polygon points="240,105 240,115 248,110" fill="#000"/>
  <!-- Step 2: Fill structures -->
  <rect x="250" y="80" width="160" height="60" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="330" y="105" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">填充结构</text>
  <text x="330" y="125" font-family="SimSun, serif" font-size="11" text-anchor="middle">算法参数+密钥引用+数据</text>
  <!-- Arrow right -->
  <line x1="410" y1="110" x2="450" y2="110" stroke="#000" stroke-width="1"/>
  <polygon points="450,105 450,115 458,110" fill="#000"/>
  <!-- Step 3: Build request -->
  <rect x="460" y="80" width="200" height="60" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="560" y="105" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">构造统一请求</text>
  <text x="560" y="125" font-family="SimSun, serif" font-size="11" text-anchor="middle">域+动作+算法+密钥+载荷</text>
  <!-- Arrow down -->
  <line x1="560" y1="140" x2="560" y2="180" stroke="#000" stroke-width="1"/>
  <polygon points="555,180 565,180 560,188" fill="#000"/>
  <!-- Step 4: Send -->
  <rect x="460" y="190" width="200" height="60" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="560" y="215" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">发送到服务器</text>
  <text x="560" y="235" font-family="SimSun, serif" font-size="11" text-anchor="middle">本地Socket通信</text>
  <!-- Arrow down -->
  <line x1="560" y1="250" x2="560" y2="290" stroke="#000" stroke-width="1"/>
  <polygon points="555,290 565,290 560,298" fill="#000"/>
  <!-- Step 5: Receive response -->
  <rect x="460" y="300" width="200" height="60" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="560" y="325" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">接收统一响应</text>
  <text x="560" y="345" font-family="SimSun, serif" font-size="11" text-anchor="middle">状态码+输出数据</text>
  <!-- Arrow left back -->
  <line x1="460" y1="330" x2="200" y2="330" stroke="#000" stroke-width="1"/>
  <polygon points="200,325 200,335 192,330" fill="#000"/>
  <!-- Return to business -->
  <rect x="40" y="300" width="160" height="60" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="120" y="325" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">返回业务结果</text>
  <text x="120" y="345" font-family="SimSun, serif" font-size="11" text-anchor="middle">签名值/错误码</text>
</svg>
