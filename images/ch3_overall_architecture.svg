<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520">
  <rect x="0" y="0" width="680" height="520" fill="#ffffff"/>
  <text x="340" y="35" font-family="SimSun, serif" font-size="18" font-weight="bold" text-anchor="middle">系统总体架构分层</text>
  <!-- Layer 5 (top): Client -->
  <rect x="180" y="65" width="320" height="55" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="340" y="97" font-family="SimSun, serif" font-size="15" font-weight="bold" text-anchor="middle">客户端封装层</text>
  <!-- Arrow -->
  <line x1="340" y1="120" x2="340" y2="150" stroke="#000" stroke-width="1"/>
  <polygon points="335,150 345,150 340,158" fill="#000"/>
  <!-- Layer 4: Server -->
  <rect x="180" y="160" width="320" height="55" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="340" y="192" font-family="SimSun, serif" font-size="15" font-weight="bold" text-anchor="middle">服务器层</text>
  <!-- Arrow -->
  <line x1="340" y1="215" x2="340" y2="245" stroke="#000" stroke-width="1"/>
  <polygon points="335,245 345,245 340,253" fill="#000"/>
  <!-- Layer 3: Scheduler -->
  <rect x="180" y="255" width="320" height="55" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="340" y="287" font-family="SimSun, serif" font-size="15" font-weight="bold" text-anchor="middle">调度层</text>
  <!-- Arrow -->
  <line x1="340" y1="310" x2="340" y2="340" stroke="#000" stroke-width="1"/>
  <polygon points="335,340 345,340 340,348" fill="#000"/>
  <!-- Layer 2: Translation -->
  <rect x="180" y="350" width="320" height="55" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="340" y="382" font-family="SimSun, serif" font-size="15" font-weight="bold" text-anchor="middle">翻译层</text>
  <!-- Arrow -->
  <line x1="340" y1="405" x2="340" y2="435" stroke="#000" stroke-width="1"/>
  <polygon points="335,435 345,435 340,443" fill="#000"/>
  <!-- Layer 1 (bottom): Adapter -->
  <rect x="180" y="445" width="320" height="55" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="340" y="477" font-family="SimSun, serif" font-size="15" font-weight="bold" text-anchor="middle">适配层</text>
  <!-- Left labels -->
  <text x="60" y="97" font-family="SimSun, serif" font-size="12" text-anchor="middle">业务侧</text>
  <text x="60" y="477" font-family="SimSun, serif" font-size="12" text-anchor="middle">设备侧</text>
  <line x1="60" y1="110" x2="60" y2="460" stroke="#000" stroke-width="0.8" stroke-dasharray="3,3"/>
  <polygon points="56,460 64,460 60,468" fill="#000"/>
  <!-- Right annotations -->
  <text x="560" y="97" font-family="SimSun, serif" font-size="11" text-anchor="middle">统一入口</text>
  <text x="560" y="192" font-family="SimSun, serif" font-size="11" text-anchor="middle">接入与并发</text>
  <text x="560" y="287" font-family="SimSun, serif" font-size="11" text-anchor="middle">能力匹配</text>
  <text x="560" y="382" font-family="SimSun, serif" font-size="11" text-anchor="middle">语义映射</text>
  <text x="560" y="477" font-family="SimSun, serif" font-size="11" text-anchor="middle">设备对接</text>
</svg>
