<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460">
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>
  <text x="350" y="35" font-family="SimSun, serif" font-size="18" font-weight="bold" text-anchor="middle">翻译适配层结构</text>
  <!-- Top: unified capability request -->
  <rect x="230" y="65" width="240" height="50" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="350" y="95" font-family="SimSun, serif" font-size="14" font-weight="bold" text-anchor="middle">统一能力请求</text>
  <!-- Arrow down -->
  <line x1="350" y1="115" x2="350" y2="145" stroke="#000" stroke-width="1"/>
  <polygon points="345,145 355,145 350,153" fill="#000"/>
  <!-- Translation rules -->
  <rect x="230" y="155" width="240" height="50" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="350" y="175" font-family="SimSun, serif" font-size="14" font-weight="bold" text-anchor="middle">翻译规则表</text>
  <text x="350" y="195" font-family="SimSun, serif" font-size="12" text-anchor="middle">(能力域+动作+算法 → 后端函数)</text>
  <!-- Arrow down -->
  <line x1="350" y1="205" x2="350" y2="235" stroke="#000" stroke-width="1"/>
  <polygon points="345,235 355,235 350,243" fill="#000"/>
  <!-- Seven capability entries -->
  <rect x="150" y="245" width="400" height="50" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="350" y="275" font-family="SimSun, serif" font-size="14" font-weight="bold" text-anchor="middle">七类通用设备能力入口</text>
  <!-- Arrow down to three adapters -->
  <line x1="350" y1="295" x2="350" y2="325" stroke="#000" stroke-width="1"/>
  <line x1="140" y1="325" x2="560" y2="325" stroke="#000" stroke-width="1"/>
  <!-- Left adapter -->
  <line x1="140" y1="325" x2="140" y2="355" stroke="#000" stroke-width="1"/>
  <polygon points="135,355 145,355 140,363" fill="#000"/>
  <rect x="60" y="365" width="160" height="70" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="140" y="393" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">密码机适配器</text>
  <text x="140" y="415" font-family="SimSun, serif" font-size="11" text-anchor="middle">SDF函数族</text>
  <!-- Middle adapter -->
  <line x1="350" y1="325" x2="350" y2="355" stroke="#000" stroke-width="1"/>
  <polygon points="345,355 355,355 350,363" fill="#000"/>
  <rect x="270" y="365" width="160" height="70" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="350" y="393" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">SKF适配器</text>
  <text x="350" y="415" font-family="SimSun, serif" font-size="11" text-anchor="middle">智能密码钥匙</text>
  <!-- Right adapter -->
  <line x1="560" y1="325" x2="560" y2="355" stroke="#000" stroke-width="1"/>
  <polygon points="555,355 565,355 560,363" fill="#000"/>
  <rect x="480" y="365" width="160" height="70" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="560" y="393" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">PQC适配器</text>
  <text x="560" y="415" font-family="SimSun, serif" font-size="11" text-anchor="middle">抗量子设备</text>
</svg>
