<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500">
  <rect x="0" y="0" width="700" height="500" fill="#ffffff"/>
  <text x="350" y="35" font-family="SimSun, serif" font-size="18" font-weight="bold" text-anchor="middle">翻译适配层结构</text>
  <!-- Top: unified request from scheduler -->
  <rect x="230" y="60" width="240" height="45" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="350" y="88" font-family="SimSun, serif" font-size="14" font-weight="bold" text-anchor="middle">调度层输出的统一请求</text>
  <!-- Arrow down -->
  <line x1="350" y1="105" x2="350" y2="130" stroke="#000" stroke-width="1"/>
  <polygon points="345,130 355,130 350,138" fill="#000"/>
  <!-- Two components side by side -->
  <!-- Left: Rule table -->
  <rect x="80" y="145" width="230" height="100" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="195" y="172" font-family="SimSun, serif" font-size="14" font-weight="bold" text-anchor="middle">翻译规则表</text>
  <text x="195" y="195" font-family="SimSun, serif" font-size="11" text-anchor="middle">按设备实例组织</text>
  <text x="195" y="215" font-family="SimSun, serif" font-size="11" text-anchor="middle">域+动作+算法 → 后端函数名</text>
  <text x="195" y="235" font-family="SimSun, serif" font-size="11" text-anchor="middle">每台设备独立一份</text>
  <!-- Right: Adapter -->
  <rect x="390" y="145" width="230" height="100" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="505" y="172" font-family="SimSun, serif" font-size="14" font-weight="bold" text-anchor="middle">设备适配器</text>
  <text x="505" y="195" font-family="SimSun, serif" font-size="11" text-anchor="middle">按接口类型组织</text>
  <text x="505" y="215" font-family="SimSun, serif" font-size="11" text-anchor="middle">管理句柄、调用厂商函数</text>
  <text x="505" y="235" font-family="SimSun, serif" font-size="11" text-anchor="middle">同类设备共享复用</text>
  <!-- Arrow: rule table -> adapter -->
  <line x1="310" y1="195" x2="390" y2="195" stroke="#000" stroke-width="1"/>
  <polygon points="385,190 385,200 393,195" fill="#000"/>
  <text x="350" y="185" font-family="SimSun, serif" font-size="10" text-anchor="middle">查到函数名</text>
  <!-- Arrow down from adapter to 7 domains -->
  <line x1="505" y1="245" x2="505" y2="275" stroke="#000" stroke-width="1"/>
  <polygon points="500,275 510,275 505,283" fill="#000"/>
  <rect x="310" y="285" width="390" height="45" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="505" y="312" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">七类通用设备能力入口</text>
  <!-- Arrow down to three concrete adapters -->
  <line x1="350" y1="330" x2="350" y2="355" stroke="#000" stroke-width="1"/>
  <line x1="140" y1="355" x2="560" y2="355" stroke="#000" stroke-width="1"/>
  <!-- Left: SDF adapter -->
  <line x1="140" y1="355" x2="140" y2="380" stroke="#000" stroke-width="1"/>
  <polygon points="135,380 145,380 140,388" fill="#000"/>
  <rect x="60" y="390" width="160" height="70" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="140" y="418" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">SDF适配器</text>
  <text x="140" y="440" font-family="SimSun, serif" font-size="11" text-anchor="middle">经典密码机</text>
  <!-- Middle: SKF adapter -->
  <line x1="350" y1="355" x2="350" y2="380" stroke="#000" stroke-width="1"/>
  <polygon points="345,380 355,380 350,388" fill="#000"/>
  <rect x="270" y="390" width="160" height="70" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="350" y="418" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">SKF适配器</text>
  <text x="350" y="440" font-family="SimSun, serif" font-size="11" text-anchor="middle">智能密码钥匙</text>
  <!-- Right: PQC adapter -->
  <line x1="560" y1="355" x2="560" y2="380" stroke="#000" stroke-width="1"/>
  <polygon points="555,380 565,380 560,388" fill="#000"/>
  <rect x="480" y="390" width="160" height="70" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="560" y="418" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">PQC适配器</text>
  <text x="560" y="440" font-family="SimSun, serif" font-size="11" text-anchor="middle">抗量子设备</text>
</svg>
