<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#000"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="350" y="28" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="16" font-weight="bold">Internal Unified Semantic Model</text>
<!-- Top: four semantic elements -->
<rect x="30" y="55" width="145" height="55" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="102" y="77" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11" font-weight="bold">Algorithm Params</text>
<text x="102" y="97" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="9">ID/Format/Padding/Level</text>
<rect x="195" y="55" width="145" height="55" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="267" y="77" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11" font-weight="bold">Key Reference</text>
<text x="267" y="97" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="9">Usage/Source/Index/Handle</text>
<rect x="360" y="55" width="145" height="55" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="432" y="77" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11" font-weight="bold">Data Buffer</text>
<text x="432" y="97" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="9">Pointer/Length</text>
<rect x="525" y="55" width="145" height="55" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="597" y="77" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11" font-weight="bold">Operation Flag</text>
<text x="597" y="97" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="9">Encrypt/Sign/Encap/Agree</text>
<!-- Arrows down converging -->
<line x1="102" y1="110" x2="102" y2="135" stroke="#000" stroke-width="1"/>
<line x1="267" y1="110" x2="267" y2="135" stroke="#000" stroke-width="1"/>
<line x1="432" y1="110" x2="432" y2="135" stroke="#000" stroke-width="1"/>
<line x1="597" y1="110" x2="597" y2="135" stroke="#000" stroke-width="1"/>
<line x1="102" y1="135" x2="597" y2="135" stroke="#000" stroke-width="1"/>
<line x1="350" y1="135" x2="350" y2="160" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Unified Request -->
<rect x="200" y="165" width="300" height="40" fill="none" stroke="#000" stroke-width="2"/>
<text x="350" y="190" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="13" font-weight="bold">Unified Request (request_t)</text>
<!-- Three outputs -->
<line x1="350" y1="205" x2="350" y2="235" stroke="#000" stroke-width="1"/>
<line x1="150" y1="235" x2="550" y2="235" stroke="#000" stroke-width="1"/>
<line x1="150" y1="235" x2="150" y2="260" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="350" y1="235" x2="350" y2="260" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="550" y1="235" x2="550" y2="260" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Three uses -->
<rect x="70" y="265" width="160" height="40" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="150" y="290" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">JSON Request Fields</text>
<rect x="270" y="265" width="160" height="40" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="350" y="290" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Capability Match Criteria</text>
<rect x="470" y="265" width="160" height="40" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="550" y="290" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="11">Low-Level Call Params</text>
<!-- Converge again -->
<line x1="150" y1="305" x2="150" y2="330" stroke="#000" stroke-width="1"/>
<line x1="350" y1="305" x2="350" y2="330" stroke="#000" stroke-width="1"/>
<line x1="550" y1="305" x2="550" y2="330" stroke="#000" stroke-width="1"/>
<line x1="150" y1="330" x2="550" y2="330" stroke="#000" stroke-width="1"/>
<line x1="350" y1="330" x2="350" y2="355" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<!-- Response -->
<rect x="200" y="360" width="300" height="40" fill="none" stroke="#000" stroke-width="2"/>
<text x="350" y="385" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="13" font-weight="bold">Unified Response (response_t)</text>
<!-- Response fields -->
<line x1="350" y1="400" x2="350" y2="420" stroke="#000" stroke-width="1"/>
<line x1="120" y1="420" x2="580" y2="420" stroke="#000" stroke-width="1"/>
<line x1="120" y1="420" x2="120" y2="440" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
<line x1="260" y1="420" x2="260" y2="440" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
<line x1="400" y1="420" x2="400" y2="440" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
<line x1="540" y1="420" x2="540" y2="440" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
<text x="120" y="460" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">Status Code</text>
<text x="260" y="460" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">Selected Device</text>
<text x="400" y="460" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">Backend Call</text>
<text x="540" y="460" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="10">Exec Result</text>
</svg>
