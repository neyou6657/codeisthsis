<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460">
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>
  <text x="350" y="35" font-family="SimSun, serif" font-size="18" font-weight="bold" text-anchor="middle">调度层处理模型</text>
  <!-- Three inputs on the left -->
  <rect x="40" y="80" width="160" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="120" y="110" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">能力域 + 算法</text>
  <rect x="40" y="160" width="160" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="120" y="190" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">密钥归属约束</text>
  <rect x="40" y="240" width="160" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="120" y="270" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">调度偏好</text>
  <!-- Horizontal lines to merge point -->
  <line x1="200" y1="105" x2="260" y2="105" stroke="#000" stroke-width="1"/>
  <line x1="200" y1="185" x2="260" y2="185" stroke="#000" stroke-width="1"/>
  <line x1="200" y1="265" x2="260" y2="265" stroke="#000" stroke-width="1"/>
  <!-- Vertical merge -->
  <line x1="260" y1="105" x2="260" y2="265" stroke="#000" stroke-width="1"/>
  <line x1="260" y1="185" x2="300" y2="185" stroke="#000" stroke-width="1"/>
  <polygon points="300,180 300,190 308,185" fill="#000"/>
  <!-- Central: device selection -->
  <rect x="310" y="150" width="180" height="70" fill="none" stroke="#000" stroke-width="1.4"/>
  <text x="400" y="180" font-family="SimSun, serif" font-size="14" font-weight="bold" text-anchor="middle">设备选择</text>
  <text x="400" y="200" font-family="SimSun, serif" font-size="12" text-anchor="middle">筛选候选 → 排序</text>
  <!-- Output to three devices -->
  <line x1="490" y1="185" x2="530" y2="185" stroke="#000" stroke-width="1"/>
  <line x1="530" y1="105" x2="530" y2="265" stroke="#000" stroke-width="1"/>
  <!-- Right: three device types -->
  <line x1="530" y1="105" x2="560" y2="105" stroke="#000" stroke-width="1"/>
  <polygon points="560,100 560,110 568,105" fill="#000"/>
  <rect x="570" y="80" width="100" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="620" y="110" font-family="SimSun, serif" font-size="12" font-weight="bold" text-anchor="middle">密码机</text>
  <line x1="530" y1="185" x2="560" y2="185" stroke="#000" stroke-width="1"/>
  <polygon points="560,180 560,190 568,185" fill="#000"/>
  <rect x="570" y="160" width="100" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="620" y="190" font-family="SimSun, serif" font-size="12" font-weight="bold" text-anchor="middle">PQC设备</text>
  <line x1="530" y1="265" x2="560" y2="265" stroke="#000" stroke-width="1"/>
  <polygon points="560,260 560,270 568,265" fill="#000"/>
  <rect x="570" y="240" width="100" height="50" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="620" y="270" font-family="SimSun, serif" font-size="12" font-weight="bold" text-anchor="middle">智能钥匙</text>
  <!-- Sequence scheduling below -->
  <line x1="400" y1="220" x2="400" y2="310" stroke="#000" stroke-width="1"/>
  <polygon points="395,310 405,310 400,318" fill="#000"/>
  <rect x="260" y="320" width="280" height="70" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="400" y="348" font-family="SimSun, serif" font-size="13" font-weight="bold" text-anchor="middle">序列调度 (混合操作)</text>
  <text x="400" y="372" font-family="SimSun, serif" font-size="12" text-anchor="middle">步骤1: 传统设备 → 步骤2: PQC设备</text>
  <!-- Bottom label -->
  <text x="400" y="430" font-family="SimSun, serif" font-size="12" text-anchor="middle">合并结果后返回上层</text>
</svg>
