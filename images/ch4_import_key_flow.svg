<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720">
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#000"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<!-- Title -->
<text x="340" y="35" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="18" font-weight="bold">Key Import Flow</text>
<!-- Step 1 -->
<rect x="210" y="60" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="90" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Receive External Key Material</text>
<line x1="340" y1="110" x2="340" y2="150" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Step 2 -->
<rect x="210" y="150" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="180" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Algorithm ID &amp; Usage Check</text>
<line x1="340" y1="200" x2="340" y2="240" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Step 3 -->
<rect x="210" y="240" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="270" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Create Unified Key Reference</text>
<line x1="340" y1="290" x2="340" y2="330" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Step 4 -->
<rect x="210" y="330" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="360" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Select Target Device</text>
<line x1="340" y1="380" x2="340" y2="420" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Step 5 -->
<rect x="210" y="420" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="450" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Write to Device Key Storage</text>
<line x1="340" y1="470" x2="340" y2="510" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Step 6 -->
<rect x="210" y="510" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="540" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Record Audit Log</text>
<line x1="340" y1="560" x2="340" y2="600" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Step 7 -->
<rect x="210" y="600" width="260" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="340" y="630" text-anchor="middle" font-family="SimSun, Microsoft YaHei, serif" font-size="14">Return Key Reference Handle</text>
</svg>
